<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FitBuddy{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<header class="site-header">
    <a class="brand" href="/">FitBuddy</a>

    <nav>
        <a href="/">Home</a>
        <a href="/docs">API Docs</a>
    </nav>
</header>

<main class="container">

    {% block content %}
    {% endblock %}

</main>

<footer class="site-footer">
    <p>
        FitBuddy is an educational wellness-planning tool,
        not medical advice.
    </p>
</footer>

</body>
</html>
